  <script id="spec" type="application/json">{"openapi": "3.0.3", "info": {"title": "EVO LMS External API", "version": "1.0.0", "description": "API chỉ đọc dữ liệu lớp học của một trường.\n\nGửi khóa trong header `X-API-Key` trên mọi request. Một khóa chỉ đọc trường được gắn. Lớp của trường khác trả 404.\n\nChỉ có GET. Danh sách phân trang bằng `cursor`, `limit` mặc định 50, tối đa 200. `next_cursor` null là hết trang.\n\nLần đầu không gửi `updated_since`. Sau đó lưu `updated_at` lớn nhất và gửi lại lần sau để chỉ lấy phần mới. Dấu `+` trong URL viết thành `%2B`.\n\nMặc định 600 request mỗi phút. Vượt hạn mức trả 429 kèm header `Retry-After`.\n\nAPI không tạo lớp, không ghi danh, không nhập điểm, không trả câu trả lời bài thi, không tải file học liệu và không có webhook.\n\n**Bấm Execute trên file HTML kèm theo thì hiện ví dụ mẫu đã lưu, không gọi server thật.** Mục Cấu trúc chương dùng đúng file structure.json đã tải lúc 15:01. Các mục còn lại là dữ liệu mẫu để thấy hình dạng JSON. Dữ liệu thật gọi bằng Postman hoặc curl, header X-API-Key, không bấm Execute trên swagger.io.\n\n## Lệnh gọi thử\n\nTrong ô Curl của từng endpoint có hai lựa chọn: PowerShell và Linux / macOS. PowerShell bắt đầu bằng curl.exe, dán vào Windows PowerShell. Linux / macOS bắt đầu bằng curl."}, "servers": [{"url": "https://api-test.evobright.edu.vn/api/external/v1", "description": "Stack test"}, {"url": "https://api.evobright.edu.vn/api/external/v1", "description": "EvoBright production"}], "tags": [{"name": "Khóa", "description": "Kiểm tra khóa đang dùng."}, {"name": "Lớp học", "description": "Danh sách lớp, chi tiết, cấu trúc bài học và học viên."}, {"name": "Kết quả học tập", "description": "Tiến độ, điểm danh, sổ điểm và kết quả thi."}], "paths": {"/me": {"get": {"tags": ["Khóa"], "summary": "Kiểm tra khóa", "description": "Thông tin khóa đang gọi: trường, các nhóm dữ liệu được đọc, có trả email học viên hay không, và hạn mức request. Endpoint này không cần scope.", "operationId": "kiểm_tr
